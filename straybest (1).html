<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StrayBest</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#d6eaf8;--sky-light:#eaf4fc;--sky-pale:#f5fafd;--sky-mid:#b8d9ef;
  --sky-deep:#7fb8d8;--sky-accent:#5ba3c9;--milk:#fdfaf5;--milk-warm:#f7f2e8;
  --text-dark:#2c3e50;--text-mid:#5a7184;--text-soft:#8ba8be;
  --radius:18px;--radius-sm:10px;
  --shadow:0 4px 24px rgba(91,163,201,.12);--shadow-sm:0 2px 10px rgba(91,163,201,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito',sans-serif;background:var(--sky-pale);min-height:100vh;
  color:var(--text-dark);
  background-image:radial-gradient(circle at 15% 20%,rgba(214,234,248,.7) 0%,transparent 45%),
                   radial-gradient(circle at 85% 75%,rgba(239,232,214,.5) 0%,transparent 40%);
  overflow-x:hidden;
}

/* STICKERS */
.sticker-left,.sticker-right{
  position:fixed;bottom:0;width:230px;pointer-events:none;z-index:10;
  filter:drop-shadow(0 4px 18px rgba(91,163,201,.18));
}
.sticker-left{left:0}.sticker-right{right:0;transform:scaleX(-1)}
.sticker-left img,.sticker-right img{width:100%;display:block}
@media(max-width:1300px){.sticker-left,.sticker-right{width:170px}}
@media(max-width:1050px){.sticker-left,.sticker-right{width:110px}}
@media(max-width:780px){.sticker-left,.sticker-right{width:80px}}
@media(max-width:580px){.sticker-left,.sticker-right{display:none}}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(253,250,245,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--sky-mid);
  padding:0 2rem;height:58px;
  display:flex;align-items:center;justify-content:center;gap:28px;
}
.brand{
  font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;
  color:var(--sky-accent);letter-spacing:.04em;display:flex;align-items:center;gap:8px;
}
.brand em{font-style:normal;color:var(--text-dark)}
.nav-tabs{display:flex;gap:4px}
.tab{font-size:13px;font-weight:600;padding:6px 18px;border-radius:20px;border:none;cursor:pointer;background:transparent;color:var(--text-mid);transition:all .2s}
.tab:hover{background:var(--sky-light);color:var(--sky-accent)}
.tab.active{background:var(--sky-accent);color:#fff}
.nav-right{position:absolute;right:2rem;display:flex;gap:8px;align-items:center}
.nav-av{
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--sky-mid);overflow:hidden;
  background:var(--sky-mid);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--sky-accent);
  transition:border-color .2s;
}
.nav-av:hover{border-color:var(--sky-accent)}
.nav-av img{width:100%;height:100%;object-fit:cover;display:none}

/* PAGE */
.page{max-width:640px;margin:0 auto;padding:28px 20px 100px}

/* PROFILE MINI */
.profile-mini{
  background:var(--milk);border:1px solid var(--sky-mid);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;display:flex;align-items:center;gap:16px;margin-bottom:20px;
}
.mini-av{
  width:56px;height:56px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--sky-mid);overflow:hidden;
  background:var(--sky-mid);display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--sky-accent);
}
.mini-av img{width:100%;height:100%;object-fit:cover;display:none}
.mini-info{flex:1}
.mini-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--text-dark)}
.mini-nick{font-size:12px;color:var(--text-soft)}
.mini-bio{font-size:12px;color:var(--text-mid);margin-top:4px;line-height:1.4}
.mini-stats{display:flex;gap:16px;margin-top:8px}
.mini-stat{font-size:12px;color:var(--text-soft)}
.mini-stat strong{color:var(--sky-accent);font-weight:700}
.btn-edit-mini{
  padding:7px 16px;border-radius:20px;background:transparent;
  border:1.5px solid var(--sky-deep);color:var(--sky-accent);
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.btn-edit-mini:hover{background:var(--sky-deep);color:#fff}

/* NEW POST BTN */
.new-post-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:13px;border-radius:var(--radius);
  background:var(--sky-accent);border:none;
  color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;transition:all .2s;box-shadow:0 4px 18px rgba(91,163,201,.25);margin-bottom:24px;
}
.new-post-btn:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 6px 24px rgba(91,163,201,.35)}
.new-post-btn:active{transform:scale(.98)}
.new-post-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* FEED */
.feed-label{font-size:11px;font-weight:700;color:var(--text-soft);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;padding-left:4px}
.posts-list{display:flex;flex-direction:column;gap:20px}

/* POST CARD */
.post{
  background:var(--milk);border:1px solid var(--sky-mid);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
  overflow:hidden;animation:postIn .3s ease;transition:box-shadow .2s;
}
.post:hover{box-shadow:var(--shadow)}
@keyframes postIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.post-body{padding:18px}
.post-header{display:flex;gap:12px;align-items:flex-start}
.post-avatar{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--sky);overflow:hidden;
  background:var(--sky-mid);display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--sky-accent);
}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-meta{flex:1;min-width:0}
.post-author{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--text-dark);line-height:1.2}
.post-nick{font-size:12px;color:var(--text-soft)}
.post-time{font-size:11px;color:var(--text-soft);float:right;margin-top:2px}
.post-text{margin-top:12px;font-size:14px;line-height:1.7;color:var(--text-dark);white-space:pre-wrap;word-break:break-word}

/* BIG IMAGE */
.post-img{
  width:100%;height:100vh;overflow:hidden;
  border-top:1px solid var(--sky-light);display:none;
  background:var(--sky-light);position:relative;
}
.post-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s cubic-bezier(.25,.46,.45,.94)}
.post-img img:hover{transform:scale(1.03)}

/* ACTIONS */
.post-actions{
  display:flex;gap:0;padding:10px 18px;
  border-top:1px solid var(--sky-light);background:rgba(245,250,253,.6);
}
.action-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:20px;border:none;background:transparent;
  color:var(--text-soft);font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.action-btn:hover{background:var(--sky-light);color:var(--sky-accent)}
.action-btn.liked{color:#e07baa}
.action-btn.commented{color:var(--sky-accent)}
.action-btn .icon{font-size:14px}
.delete-btn{
  margin-left:auto;padding:5px 10px;border-radius:20px;border:none;
  background:transparent;color:var(--sky-mid);font-size:13px;cursor:pointer;transition:all .15s;
}
.delete-btn:hover{background:#fce8e8;color:#c0504d}

/* COMMENTS SECTION */
.comments-section{
  border-top:1px solid var(--sky-light);background:var(--sky-pale);
  display:none;
}
.comments-section.open{display:block}
.comments-list{padding:12px 18px 0;display:flex;flex-direction:column;gap:10px;max-height:300px;overflow-y:auto}
.comment{display:flex;gap:10px;align-items:flex-start}
.com-av{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  border:1.5px solid var(--sky-mid);overflow:hidden;
  background:var(--sky-mid);display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--sky-accent);
}
.com-av img{width:100%;height:100%;object-fit:cover;display:none}
.com-bubble{
  background:var(--milk);border:1px solid var(--sky-mid);border-radius:12px 12px 12px 3px;
  padding:8px 12px;flex:1;
}
.com-name{font-size:12px;font-weight:700;color:var(--sky-accent)}
.com-text{font-size:13px;color:var(--text-dark);line-height:1.5;margin-top:2px;word-break:break-word}
.com-time{font-size:10px;color:var(--text-soft);margin-top:4px}
.com-delete{
  background:none;border:none;cursor:pointer;color:var(--sky-mid);font-size:11px;
  padding:2px 6px;border-radius:8px;transition:all .15s;margin-top:4px;
}
.com-delete:hover{color:#c0504d;background:#fce8e8}
.comment-form{
  display:flex;gap:8px;align-items:center;
  padding:12px 18px;border-top:1px solid var(--sky-light);
}
.com-form-av{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  border:1.5px solid var(--sky-mid);overflow:hidden;
  background:var(--sky-mid);display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:12px;color:var(--sky-accent);
}
.com-form-av img{width:100%;height:100%;object-fit:cover;display:none}
.com-input{
  flex:1;padding:7px 12px;border-radius:20px;
  border:1.5px solid var(--sky-mid);background:var(--milk);
  font-family:'Nunito',sans-serif;font-size:13px;color:var(--text-dark);
  outline:none;transition:border-color .2s;
}
.com-input:focus{border-color:var(--sky-accent);background:#fff}
.com-input::placeholder{color:var(--text-soft)}
.com-send{
  padding:7px 14px;border-radius:20px;border:none;
  background:var(--sky-accent);color:#fff;
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
  cursor:pointer;transition:opacity .2s;white-space:nowrap;
}
.com-send:hover{opacity:.85}
.no-comments{font-size:12px;color:var(--text-soft);text-align:center;padding:12px 0;font-style:italic}

/* MODALS */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(44,62,80,.28);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px;
}
.modal-bg.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--milk);border-radius:var(--radius);
  border:1px solid var(--sky-mid);box-shadow:0 12px 48px rgba(91,163,201,.18);
  padding:28px;width:100%;max-width:460px;
  animation:slideUp .25s ease;max-height:90vh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--sky-accent);margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:5px;letter-spacing:.05em;text-transform:uppercase}
.field input,.field textarea{
  width:100%;padding:10px 14px;
  border:1.5px solid var(--sky-mid);border-radius:var(--radius-sm);
  background:var(--sky-pale);color:var(--text-dark);
  font-family:'Nunito',sans-serif;font-size:14px;resize:none;outline:none;transition:border-color .2s;
}
.field input:focus,.field textarea:focus{border-color:var(--sky-accent);background:#fff}
.field input.error{border-color:#e07b7b}
.err-msg{font-size:11px;color:#c0504d;margin-top:4px;display:none}
.err-msg.show{display:block}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-primary{flex:1;padding:10px;border-radius:20px;background:var(--sky-accent);border:none;color:#fff;font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.85}
.btn-cancel{padding:10px 20px;border-radius:20px;background:transparent;border:1.5px solid var(--sky-mid);color:var(--text-soft);font-family:'Nunito',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
.btn-cancel:hover{border-color:var(--sky-deep);color:var(--sky-accent)}
.av-preview-row{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.av-preview-sm{
  width:42px;height:42px;border-radius:50%;border:2px solid var(--sky-mid);
  overflow:hidden;background:var(--sky);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--sky-accent);
}
.av-preview-sm img{width:100%;height:100%;object-fit:cover;display:none}
.char-count{font-size:11px;color:var(--text-soft);text-align:right;margin-top:4px}
.char-count.warn{color:#e07b7b}

/* IMAGE PICKER in compose */
.img-picker-tabs{display:flex;gap:6px;margin-bottom:8px}
.img-tab{
  font-size:12px;font-weight:600;padding:5px 14px;border-radius:20px;
  border:1.5px solid var(--sky-mid);cursor:pointer;background:transparent;
  color:var(--text-soft);transition:all .2s;
}
.img-tab.active{background:var(--sky-accent);color:#fff;border-color:var(--sky-accent)}
.img-tab-panel{display:none}
.img-tab-panel.active{display:block}
.file-upload-area{
  border:2px dashed var(--sky-mid);border-radius:var(--radius-sm);
  padding:20px;text-align:center;cursor:pointer;
  transition:all .2s;background:var(--sky-pale);
  position:relative;
}
.file-upload-area:hover{border-color:var(--sky-accent);background:var(--sky-light)}
.file-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-icon{font-size:24px;margin-bottom:6px;color:var(--sky-deep)}
.upload-text{font-size:13px;color:var(--text-mid)}
.upload-hint{font-size:11px;color:var(--text-soft);margin-top:3px}
.img-preview-thumb{
  margin-top:10px;border-radius:10px;overflow:hidden;
  border:1px solid var(--sky-mid);max-height:160px;display:none;
}
.img-preview-thumb img{width:100%;object-fit:cover;display:block}

/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--text-soft)}
.empty-cloud{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-text{font-size:14px;line-height:1.6}

/* TOAST */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--sky-accent);color:#fff;
  padding:10px 24px;border-radius:30px;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;
  box-shadow:0 6px 24px rgba(91,163,201,.35);
  opacity:0;transition:all .3s;pointer-events:none;z-index:400;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--sky-pale)}
::-webkit-scrollbar-thumb{background:var(--sky-mid);border-radius:10px}
</style>
</head>

<!-- PROFILE MODAL -->
<div class="modal-bg" id="profile-modal">
  <div class="modal">
    <div class="modal-title">✦ Мой профиль</div>
    <div class="field">
      <label>Имя</label>
      <div class="av-preview-row">
        <div class="av-preview-sm" id="pv-av">?<img id="pv-av-img" alt=""></div>
        <input id="m-name" type="text" placeholder="Ваше имя" maxlength="40" oninput="previewAv()">
      </div>
    </div>
    <div class="field">
      <label>Никнейм</label>
      <input id="m-nick" type="text" placeholder="@nickname" maxlength="30">
    </div>
    <div class="field">
      <label>Email</label>
      <input id="m-email" type="email" placeholder="you@example.com" maxlength="80">
      <div class="err-msg" id="email-err">Введите корректный email</div>
    </div>
    <div class="field">
      <label>Ссылка на аватар</label>
      <input id="m-avatar" type="url" placeholder="https://..." maxlength="300" oninput="previewAv()">
    </div>
    <div class="field">
      <label>О себе</label>
      <textarea id="m-bio" rows="3" placeholder="Расскажите о себе..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeProfileModal()">Отмена</button>
      <button class="btn-primary" onclick="saveProfile()">Сохранить</button>
    </div>
  </div>
</div>

<!-- COMPOSE MODAL -->
<div class="modal-bg" id="compose-modal">
  <div class="modal">
    <div class="modal-title">✦ Новый пост</div>
    <div class="field">
      <label>Текст поста</label>
      <textarea id="post-text" rows="4" placeholder="Что у вас нового?" maxlength="280" oninput="onComposeInput()"></textarea>
      <div class="char-count" id="char-count">280</div>
    </div>
    <div class="field">
      <label>Фото</label>
      <div class="img-picker-tabs">
        <button class="img-tab active" onclick="switchImgTab('url',this)">По ссылке</button>
        <button class="img-tab" onclick="switchImgTab('file',this)">С устройства</button>
      </div>
      <!-- URL tab -->
      <div class="img-tab-panel active" id="tab-url">
        <input id="post-img-url" type="url" placeholder="https://example.com/photo.jpg" oninput="previewImgUrl()">
        <div class="img-preview-thumb" id="url-preview">
          <img id="url-preview-img" alt="">
        </div>
      </div>
      <!-- FILE tab -->
      <div class="img-tab-panel" id="tab-file">
        <div class="file-upload-area" id="drop-zone">
          <input type="file" accept="image/*" id="file-input" onchange="handleFileUpload(event)">
          <div class="upload-icon">🖼</div>
          <div class="upload-text">Нажмите или перетащите фото</div>
          <div class="upload-hint">JPG, PNG, GIF, WEBP</div>
        </div>
        <div class="img-preview-thumb" id="file-preview">
          <img id="file-preview-img" alt="">
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeComposeModal()">Отмена</button>
      <button class="btn-primary" onclick="publishPost()">Опубликовать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- PAGE -->
<div class="page">
  <!-- Profile mini -->
  <div class="profile-mini">
    <div class="mini-av" id="mini-av">
      <span id="mini-av-init">?</span><img id="mini-av-img" alt="">
    </div>
    <div class="mini-info">
      <div class="mini-name" id="mini-name">Гость</div>
      <div class="mini-nick" id="mini-nick">@username</div>
      <div class="mini-bio" id="mini-bio">Заполните профиль ✨</div>
      <div class="mini-stats">
        <div class="mini-stat"><strong id="pc">0</strong> постов</div>
        <div class="mini-stat"><strong id="lc">0</strong> лайков</div>
        <div class="mini-stat"><strong id="cc">0</strong> комментариев</div>
      </div>
    </div>
    <button class="btn-edit-mini" onclick="openProfileModal()">Изменить</button>
  </div>

  <button class="new-post-btn" id="new-post-btn" onclick="openComposeModal()">
    <span style="font-size:18px">✦</span> Создать новый пост
  </button>

  <div class="feed-label">Лента постов</div>
  <div class="posts-list" id="posts-list"></div>
</div>

<script>
const KP='sb_profile2',KO='sb_posts3';
let profile={},posts=[];
let currentImgData=''; // base64 or url for current compose

function init(){
  try{profile=JSON.parse(localStorage.getItem(KP)||'{}')}catch(e){profile={}}
  try{posts=JSON.parse(localStorage.getItem(KO)||'[]')}catch(e){posts=[]}
  renderAll();
}

/* ── HELPERS ── */
function initials(n){return(n||'?').trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function setAv(initEl,imgEl,name,url){
  if(url&&(url.startsWith('http')||url.startsWith('data:'))){
    imgEl.src=url;imgEl.style.display='block';initEl.style.display='none';
    imgEl.onerror=()=>{imgEl.style.display='none';initEl.style.display=''}
  }else{imgEl.style.display='none';initEl.style.display='';initEl.textContent=initials(name)}
}
function savePosts(){
  // store only url-based images to avoid quota, base64 stored separately
  try{localStorage.setItem(KO,JSON.stringify(posts))}catch(e){
    // if quota exceeded, trim old posts
    posts=posts.slice(0,20);
    try{localStorage.setItem(KO,JSON.stringify(posts))}catch(e2){}
  }
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

/* ── RENDER ALL ── */
function renderAll(){renderMini();renderPosts();updateNavAv()}

function renderMini(){
  const{name='',nick='',bio='',avatar=''}=profile;
  document.getElementById('mini-name').textContent=name||'Гость';
  document.getElementById('mini-nick').textContent=nick?'@'+nick.replace('@',''):'@username';
  document.getElementById('mini-bio').textContent=bio||'Заполните профиль ✨';
  setAv(document.getElementById('mini-av-init'),document.getElementById('mini-av-img'),name,avatar);
  document.getElementById('pc').textContent=posts.length;
  document.getElementById('lc').textContent=posts.reduce((s,p)=>s+(p.likes||0),0);
  document.getElementById('cc').textContent=posts.reduce((s,p)=>s+(p.comments||[]).length,0);
  document.getElementById('new-post-btn').disabled=!name;
}
function updateNavAv(){
  setAv(document.getElementById('nav-av-init'),document.getElementById('nav-av-img'),profile.name||'',profile.avatar||'');
}

/* ── RENDER POSTS ── */
function renderPosts(){
  const c=document.getElementById('posts-list');
  if(!posts.length){
    c.innerHTML=`<div class="empty"><div class="empty-cloud">☁️</div><div class="empty-text">Пока нет постов.<br>Нажмите «Создать новый пост» чтобы начать!</div></div>`;
    return;
  }
  c.innerHTML=posts.map(p=>postHTML(p)).join('');
}

function postHTML(p){
  const si=!p.avatar||(p.avatar.startsWith('http')||p.avatar.startsWith('data:'))?false:true;
  const noAv=!p.avatar;
  const avContent=(!noAv&&(p.avatar.startsWith('http')||p.avatar.startsWith('data:')))
    ?`<img src="${esc(p.avatar)}" alt="" onerror="this.style.display='none';this.previousSibling.style.display=''"><span style="display:none">${esc(initials(p.name))}</span>`
    :`<span>${esc(initials(p.name))}</span>`;

  const commentsHTML=(p.comments||[]).map((c,i)=>{
    const csi=!c.avatar||(!(c.avatar.startsWith('http')||c.avatar.startsWith('data:')));
    const cavContent=(!csi&&c.avatar)
      ?`<img src="${esc(c.avatar)}" alt="" onerror="this.style.display='none';this.previousSibling.style.display=''"><span style="display:none">${esc(initials(c.name))}</span>`
      :`<span>${esc(initials(c.name))}</span>`;
    return`<div class="comment">
      <div class="com-av">${cavContent}</div>
      <div class="com-bubble">
        <div class="com-name">${esc(c.name)}${c.nick?` <span style="font-weight:400;color:var(--text-soft)">@${esc(c.nick)}</span>`:''}</div>
        <div class="com-text">${esc(c.text)}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="com-time">${esc(c.time)}</div>
          <button class="com-delete" onclick="deleteComment(${p.id},${i})">✕ удалить</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const comCount=(p.comments||[]).length;
  return`<div class="post" id="post-${p.id}">
    ${p.img?`<div class="post-img" style="display:block"><img src="${esc(p.img)}" alt="" onerror="this.parentElement.style.display='none'"></div>`:''}
    <div class="post-body">
      <div class="post-header">
        <div class="post-avatar">${avContent}</div>
        <div class="post-meta">
          <div class="post-author">${esc(p.name)}</div>
          <div class="post-nick">${p.nick?'@'+esc(p.nick):''}<span class="post-time">${esc(p.time)}</span></div>
        </div>
      </div>
      <div class="post-text">${esc(p.text)}</div>
    </div>
    <div class="post-actions">
      <button class="action-btn${p.liked?' liked':''}" onclick="toggleLike(${p.id})">
        <span class="icon">${p.liked?'♥':'♡'}</span> ${p.likes||0}
      </button>
      <button class="action-btn${comCount>0?' commented':''}" onclick="toggleComments(${p.id})">
        <span class="icon">💬</span> ${comCount}
      </button>
      <button class="delete-btn" onclick="deletePost(${p.id})">✕</button>
    </div>
    <div class="comments-section" id="cs-${p.id}">
      <div class="comments-list" id="cl-${p.id}">
        ${comCount?commentsHTML:`<div class="no-comments">Комментариев пока нет. Будьте первым! ☁️</div>`}
      </div>
      <div class="comment-form">
        <div class="com-form-av" id="cfa-${p.id}"></div>
        <input class="com-input" id="ci-${p.id}" type="text" placeholder="Написать комментарий..." maxlength="200" onkeydown="if(event.key==='Enter')sendComment(${p.id})">
        <button class="com-send" onclick="sendComment(${p.id})">Отправить</button>
      </div>
    </div>
  </div>`;
}

/* refresh comment form avatars after render */
function refreshComFormAvatars(){
  posts.forEach(p=>{
    const el=document.getElementById('cfa-'+p.id);
    if(!el)return;
    const{name='',avatar=''}=profile;
    if(avatar&&(avatar.startsWith('http')||avatar.startsWith('data:'))){
      el.innerHTML=`<img src="${esc(avatar)}" alt="" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'">`;
    }else{
      el.textContent=initials(name);
      el.style.fontFamily="'Cormorant Garamond',serif";
      el.style.fontSize='12px';el.style.color='var(--sky-accent)';
      el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';
    }
  });
}

/* ── TOGGLE COMMENTS ── */
function toggleComments(id){
  const cs=document.getElementById('cs-'+id);
  cs.classList.toggle('open');
  if(cs.classList.contains('open')){
    refreshComFormAvatars();
    setTimeout(()=>{const inp=document.getElementById('ci-'+id);if(inp)inp.focus()},100);
  }
}

/* ── SEND COMMENT ── */
function sendComment(id){
  if(!profile.name){toast('Сначала заполните профиль!');return}
  const inp=document.getElementById('ci-'+id);
  const text=(inp.value||'').trim();
  if(!text)return;
  const p=posts.find(x=>x.id===id);if(!p)return;
  if(!p.comments)p.comments=[];
  p.comments.push({
    name:profile.name,nick:profile.nick||'',avatar:profile.avatar||'',
    text,time:new Date().toLocaleString('ru',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})
  });
  savePosts();inp.value='';
  // re-render comments list only
  const cl=document.getElementById('cl-'+id);
  if(cl){
    cl.innerHTML=p.comments.map((c,i)=>{
      const csi=!c.avatar||(!(c.avatar.startsWith('http')||c.avatar.startsWith('data:')));
      const cavContent=(!csi&&c.avatar)
        ?`<img src="${esc(c.avatar)}" alt="" onerror="this.style.display='none';this.previousSibling.style.display=''"><span style="display:none">${esc(initials(c.name))}</span>`
        :`<span>${esc(initials(c.name))}</span>`;
      return`<div class="comment">
        <div class="com-av">${cavContent}</div>
        <div class="com-bubble">
          <div class="com-name">${esc(c.name)}${c.nick?` <span style="font-weight:400;color:var(--text-soft)">@${esc(c.nick)}</span>`:''}</div>
          <div class="com-text">${esc(c.text)}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="com-time">${esc(c.time)}</div>
            <button class="com-delete" onclick="deleteComment(${id},${i})">✕ удалить</button>
          </div>
        </div>
      </div>`;
    }).join('');
    cl.scrollTop=cl.scrollHeight;
  }
  renderMini();
}

function deleteComment(postId,idx){
  const p=posts.find(x=>x.id===postId);if(!p||!p.comments)return;
  p.comments.splice(idx,1);savePosts();renderAll();
  // reopen comments
  setTimeout(()=>{const cs=document.getElementById('cs-'+postId);if(cs)cs.classList.add('open');refreshComFormAvatars();},50);
}

/* ── ACTIONS ── */
function toggleLike(id){
  const p=posts.find(x=>x.id===id);if(!p)return;
  p.liked=!p.liked;p.likes=(p.likes||0)+(p.liked?1:-1);
  savePosts();renderAll();
}
function deletePost(id){
  posts=posts.filter(x=>x.id!==id);savePosts();renderAll();
}

/* ── PROFILE MODAL ── */
function openProfileModal(){
  const{name='',nick='',email='',avatar='',bio=''}=profile;
  document.getElementById('m-name').value=name;
  document.getElementById('m-nick').value=nick;
  document.getElementById('m-email').value=email;
  document.getElementById('m-avatar').value=avatar;
  document.getElementById('m-bio').value=bio;
  previewAv();
  document.getElementById('email-err').classList.remove('show');
  document.getElementById('m-email').classList.remove('error');
  document.getElementById('profile-modal').classList.add('open');
}
function closeProfileModal(){document.getElementById('profile-modal').classList.remove('open')}
function previewAv(){
  const url=document.getElementById('m-avatar').value.trim();
  const name=document.getElementById('m-name').value.trim();
  const el=document.getElementById('pv-av');const img=document.getElementById('pv-av-img');
  if(url.startsWith('http')||url.startsWith('data:')){img.src=url;img.style.display='block';el.textContent='';el.appendChild(img)}
  else{img.style.display='none';el.textContent=initials(name)||'?';el.appendChild(img)}
}
function saveProfile(){
  const email=document.getElementById('m-email').value.trim();
  document.getElementById('m-email').classList.remove('error');
  document.getElementById('email-err').classList.remove('show');
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){
    document.getElementById('m-email').classList.add('error');
    document.getElementById('email-err').classList.add('show');return;
  }
  profile={
    name:document.getElementById('m-name').value.trim(),
    nick:document.getElementById('m-nick').value.trim().replace('@',''),
    email,avatar:document.getElementById('m-avatar').value.trim(),
    bio:document.getElementById('m-bio').value.trim()
  };
  localStorage.setItem(KP,JSON.stringify(profile));
  closeProfileModal();renderAll();toast('Профиль сохранён ✨');
}

/* ── COMPOSE MODAL ── */
let activeImgTab='url';
function switchImgTab(tab,btn){
  activeImgTab=tab;
  document.querySelectorAll('.img-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-url').classList.toggle('active',tab==='url');
  document.getElementById('tab-file').classList.toggle('active',tab==='file');
  currentImgData='';
}
function openComposeModal(){
  if(!profile.name){openProfileModal();return}
  document.getElementById('post-text').value='';
  document.getElementById('post-img-url').value='';
  document.getElementById('char-count').textContent='280';
  document.getElementById('char-count').className='char-count';
  document.getElementById('url-preview').style.display='none';
  document.getElementById('file-preview').style.display='none';
  currentImgData='';
  activeImgTab='url';
  document.querySelectorAll('.img-tab').forEach((b,i)=>b.classList.toggle('active',i===0));
  document.getElementById('tab-url').classList.add('active');
  document.getElementById('tab-file').classList.remove('active');
  document.getElementById('compose-modal').classList.add('open');
  setTimeout(()=>document.getElementById('post-text').focus(),200);
}
function closeComposeModal(){document.getElementById('compose-modal').classList.remove('open')}
function onComposeInput(){
  const l=280-document.getElementById('post-text').value.length;
  const cc=document.getElementById('char-count');
  cc.textContent=l;cc.className='char-count'+(l<40?' warn':'');
}
function previewImgUrl(){
  const url=document.getElementById('post-img-url').value.trim();
  const pv=document.getElementById('url-preview');
  const pvimg=document.getElementById('url-preview-img');
  if(url.startsWith('http')){
    pvimg.src=url;pv.style.display='block';currentImgData=url;
    pvimg.onerror=()=>{pv.style.display='none';currentImgData=''};
  }else{pv.style.display='none';currentImgData=''}
}
function handleFileUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const data=ev.target.result;
    currentImgData=data;
    const pv=document.getElementById('file-preview');
    const pvimg=document.getElementById('file-preview-img');
    pvimg.src=data;pv.style.display='block';
  };
  reader.readAsDataURL(file);
}
function publishPost(){
  const text=document.getElementById('post-text').value.trim();
  if(!text)return;
  posts.unshift({
    id:Date.now(),text,img:currentImgData||'',
    name:profile.name,nick:profile.nick||'',avatar:profile.avatar||'',
    likes:0,liked:false,comments:[],
    time:new Date().toLocaleString('ru',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})
  });
  savePosts();closeComposeModal();renderAll();toast('Пост опубликован! 🌟');
}

/* ── TABS ── */
function showTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='feed')||(i===1&&tab==='profile')));
  if(tab==='profile')openProfileModal();
}

/* close on bg click */
document.getElementById('profile-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeProfileModal()});
document.getElementById('compose-modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeComposeModal()});

init();
</script>
